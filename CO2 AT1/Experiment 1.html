
<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; text-align: center; }
header, footer { background: lightblue; padding: 10px; }
main { display: flex; gap: 10px; }
.box { border: 1px solid gray; padding: 15px; flex: 1; }
@media(max-width: 500px) {
  main { flex-direction: column; }
}
</style>
</head>
<body>

<header><h2>My Mini Store</h2></header>
<h3>Our Products</h3>

<main>
<div class="box">
  <h3>Soap</h3>
  <p>₹30</p>
  <button onclick="add(30)">Add to Cart</button>
</div>
<div class="box">
  <h3>Shampoo</h3>
  <p>₹80</p>
  <button onclick="add(80)">Add to Cart</button>
</div>
<div class="box">
  <h3>Biscuits</h3>
  <p>₹20</p>
  <button onclick="add(20)">Add to Cart</button>
</div>
</main>

<h3>Cart: <span id="count">0</span> items</h3>
<h3>Total: ₹<span id="total">0</span></h3>
<button onclick="clearCart()">Clear Cart</button>
<p id="msg"></p>

<footer>Thank you for shopping!</footer>

<script>
let count = 0, total = 0;
function add(price) {
  count++;
  total += price;
  document.getElementById("count").innerHTML = count;
  document.getElementById("total").innerHTML = total;
  document.getElementById("msg").innerHTML = "Item added!";
}
function clearCart() {
  count = 0;
  total = 0;
  document.getElementById("count").innerHTML = 0;
  document.getElementById("total").innerHTML = 0;
  document.getElementById("msg").innerHTML = "Cart cleared!";
}
</script>

</body>
</html>
