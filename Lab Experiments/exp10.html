<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Experiment 10 - StyleHub</title>
<style>body{font-family:Arial;margin:20px;background:#fff9f5}section{background:white;padding:15px;margin:12px 0;border:1px solid #ccc}.product{padding:10px;border-bottom:1px solid #ddd}button,input,select{padding:8px;margin:5px}</style></head>
<body><h1>StyleHub Fashion Store</h1><section><h2>Shop Fashion</h2><input id="search" placeholder="Search clothing"><select id="category"><option>All</option><option>Men</option><option>Women</option><option>Kids</option></select><button onclick="filter()">Search</button>
<div id="products"><div class="product" data-category="Men">Men's Casual Shirt - ₹899 <button onclick="add('Men Casual Shirt',899)">Add to Cart</button></div><div class="product" data-category="Women">Women's Dress - ₹1,499 <button onclick="add('Women Dress',1499)">Add to Cart</button></div><div class="product" data-category="Kids">Kids T-shirt - ₹399 <button onclick="add('Kids T-shirt',399)">Add to Cart</button></div><div class="product" data-category="Women">Women's Shoes - ₹1,199 <button onclick="add('Women Shoes',1199)">Add to Cart</button></div></div></section>
<section><h2>Cart and Checkout</h2><ul id="cart"></ul><p id="total">Total: ₹0</p><input id="customer" placeholder="Customer name"><button onclick="checkout()">Place Order</button><p id="message"></p></section>
<section><h2>Order Status</h2><button onclick="status()">Check Order Status</button><p id="orderStatus"></p></section>
<script>
let cart=[],ordered=false;function filter(){let q=search.value.toLowerCase(),c=category.value;document.querySelectorAll('.product').forEach(p=>p.style.display=p.innerText.toLowerCase().includes(q)&&(c==='All'||p.dataset.category===c)?'':'none')}
function add(n,p){cart.push({n,p});render()}function render(){cart.innerHTML='';cart.forEach((x,i)=>{let li=document.createElement('li');li.textContent=x.n+' - ₹'+x.p+' ';let b=document.createElement('button');b.textContent='Remove';b.onclick=()=>{cart.splice(i,1);render()};li.appendChild(b);cart.appendChild(li)});document.getElementById('total').innerText='Total: ₹'+cart.reduce((s,x)=>s+x.p,0)}
function checkout(){if(!customer.value.trim()||!cart.length){alert('Enter customer name and add at least one item.');return}ordered=true;message.innerText='Thank you, '+customer.value+'. Order placed. Total ₹'+cart.reduce((s,x)=>s+x.p,0)+'.'}
function status(){orderStatus.innerText=ordered?'Order confirmed. It is being prepared.':'No order placed yet.'}
</script></body></html>
