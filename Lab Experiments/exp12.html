<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Experiment - InsureEasy</title><style>body{font-family:Arial;margin:20px;background:#f5f5f5}section{background:white;padding:15px;margin:12px 0;border:1px solid #ccc}input,select,button{padding:8px;margin:5px}.item{border:1px solid #ddd;padding:10px;margin:8px}</style></head><body><h1>InsureEasy</h1><section><h2>Policy Options</h2><select id="policy"><option>Health Insurance - ₹5,000/year</option><option>Vehicle Insurance - ₹3,000/year</option><option>Home Insurance - ₹4,000/year</option></select><input id="name" placeholder="Customer name"><input id="age" type="number" placeholder="Age"><button onclick="applyP()">Apply</button><p id="result"></p></section><section><h2>My Policy</h2><button onclick="viewP()">View Policy</button><p id="info"></p></section><section><h2>Premium Reminder</h2><input type="date" id="due"><button onclick="remind()">Set Reminder</button><p id="rem"></p></section><script>let selected='';function applyP(){if(!name.value||!age.value)return alert('Enter name and age');selected=policy.value;result.innerText='Application submitted for '+name.value+'. Selected: '+selected+' (demo)'}function viewP(){info.innerText=selected||'No policy selected'}function remind(){rem.innerText=due.value?'Reminder set for '+due.value+' (demo)':'Select a date'}</script></body></html>
