<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Experiment - BlossomGifts</title><style>body{font-family:Arial;margin:20px;background:#f5f5f5}section{background:white;padding:15px;margin:12px 0;border:1px solid #ccc}input,select,button{padding:8px;margin:5px}.item{border:1px solid #ddd;padding:10px;margin:8px}</style></head><body><h1>BlossomGifts</h1><section><h2>Gift Catalog</h2><select id="category"><option>All</option><option>Flowers</option><option>Gift Basket</option><option>Personalized</option></select><button onclick="filterP()">Filter</button><div class="item" data-category="Flowers">Rose Bouquet ₹799 <button onclick="add('Rose Bouquet',799)">Add</button></div><div class="item" data-category="Gift Basket">Gift Basket ₹1200 <button onclick="add('Gift Basket',1200)">Add</button></div><div class="item" data-category="Personalized">Personalized Mug ₹399 <button onclick="add('Mug',399)">Add</button></div></section><section><h2>Cart and Delivery</h2><ul id="cart"></ul><p id="total">Total: ₹0</p><input id="recipient" placeholder="Recipient"><input id="address" placeholder="Delivery address"><input type="date" id="delivery"><button onclick="checkout()">Place Order</button><p id="result"></p></section><script>let items=[];function filterP(){document.querySelectorAll('.item').forEach(x=>x.style.display=category.value==='All'||x.dataset.category===category.value?'':'none')}function add(n,p){items.push({n,p});render()}function render(){cart.innerHTML='';items.forEach((x,i)=>{let li=document.createElement('li');li.textContent=x.n+' ₹'+x.p;let b=document.createElement('button');b.textContent='Remove';b.onclick=()=>{items.splice(i,1);render()};li.appendChild(b);cart.appendChild(li)});total.innerText='Total: ₹'+items.reduce((s,x)=>s+x.p,0)}function checkout(){if(!items.length||!recipient.value||!address.value||!delivery.value)return alert('Complete cart and delivery details');result.innerText='Order placed for '+recipient.value+'. Delivery '+delivery.value+'. Total ₹'+items.reduce((s,x)=>s+x.p,0)+' (demo)'}</script></body></html>
