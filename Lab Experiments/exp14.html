<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Experiment - ReNewMarket</title><style>body{font-family:Arial;margin:20px;background:#f5f5f5}section{background:white;padding:15px;margin:12px 0;border:1px solid #ccc}input,select,button{padding:8px;margin:5px}.item{border:1px solid #ddd;padding:10px;margin:8px}</style></head><body><h1>ReNewMarket - Second-hand Marketplace</h1><section><h2>Browse Items</h2><select id="category"><option>All</option><option>Electronics</option><option>Furniture</option><option>Clothing</option><option>Collectibles</option></select><input id="search" placeholder="Search"><button onclick="filterP()">Search</button><div class="item" data-category="Electronics">Used Laptop ₹18,000 <button onclick="contact('Laptop')">Contact Seller</button></div><div class="item" data-category="Furniture">Study Table ₹2,000 <button onclick="contact('Study Table')">Contact Seller</button></div><div class="item" data-category="Clothing">Jacket ₹700 <button onclick="contact('Jacket')">Contact Seller</button></div><div class="item" data-category="Collectibles">Old Camera ₹3,500 <button onclick="contact('Camera')">Contact Seller</button></div><p id="msg"></p></section><section><h2>Sell Item</h2><input id="seller" placeholder="Seller name"><input id="product" placeholder="Item"><input id="price" type="number" placeholder="Price"><select id="sellCategory"><option>Electronics</option><option>Furniture</option><option>Clothing</option><option>Collectibles</option></select><button onclick="postP()">Post Listing</button><p id="posted"></p></section><script>function filterP(){let q=search.value.toLowerCase(),c=category.value;document.querySelectorAll('.item').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)&&(c==='All'||x.dataset.category===c)?'':'none')}function contact(n){msg.innerText='Contact request for '+n+' (demo)'}function postP(){if(!seller.value||!product.value||!price.value)return alert('Fill listing details');posted.innerText=product.value+' listed for ₹'+price.value+'.'}</script></body></html>
