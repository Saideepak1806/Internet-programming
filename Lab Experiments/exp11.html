<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Experiment - Home Finder</title><style>body{font-family:Arial;margin:20px;background:#f5f5f5}section{background:white;padding:15px;margin:12px 0;border:1px solid #ccc}input,select,button{padding:8px;margin:5px}.item{border:1px solid #ddd;padding:10px;margin:8px}</style></head><body><h1>Home Finder</h1><section><h2>Search Properties</h2><input id="area" placeholder="Location"><select id="type"><option>Any</option><option>House</option><option>Apartment</option><option>Land</option></select><input id="min" type="number" placeholder="Min budget"><input id="max" type="number" placeholder="Max budget"><button onclick="searchP()">Search</button><p id="msg"></p></section><section><h2>Properties</h2><div class="item" data-price="4500000" data-type="House" data-area="Chennai">House in Chennai - ₹45,00,000 <button onclick="saveP('House in Chennai')">Save</button></div><div class="item" data-price="2500000" data-type="Apartment" data-area="Hyderabad">Apartment in Hyderabad - ₹25,00,000 <button onclick="saveP('Apartment in Hyderabad')">Save</button></div><div class="item" data-price="1200000" data-type="Land" data-area="Sriperumbudur">Land in Sriperumbudur - ₹12,00,000 <button onclick="saveP('Land in Sriperumbudur')">Save</button></div></section><section><h2>Saved Properties</h2><ul id="saved"></ul></section><script>function searchP(){let a=area.value.toLowerCase(),t=type.value,lo=Number(min.value)||0,hi=Number(max.value)||Infinity,c=0;document.querySelectorAll('.item').forEach(p=>{let ok=p.dataset.area.toLowerCase().includes(a)&&(t==='Any'||p.dataset.type===t)&&+p.dataset.price>=lo&&+p.dataset.price<=hi;p.style.display=ok?'':'none';if(ok)c++});msg.innerText=c+' properties found'}function saveP(n){let li=document.createElement('li');li.textContent=n;saved.appendChild(li)}</script></body></html>
