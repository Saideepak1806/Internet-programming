<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Experiment 4 - Train Reservation</title>
<style>body{font-family:Arial;margin:20px;background:#f5f5f5}section{background:white;padding:15px;margin:12px 0;border:1px solid #ccc}input,select,button{padding:8px;margin:5px}</style></head>
<body><h1>Railway Reservation</h1><section><h2>Find Train</h2><input id="origin" placeholder="Origin station"><input id="destination" placeholder="Destination station"><input type="date" id="journey"><button onclick="trains()">Search Trains</button><p id="trainResult"></p></section>
<section><h2>Book Ticket</h2><input id="name" placeholder="Passenger name"><select id="class"><option>Sleeper</option><option>AC 3 Tier</option><option>AC 2 Tier</option></select><button onclick="reserve()">Reserve</button><p id="pnr"></p></section>
<section><h2>Check PNR Status</h2><input id="pnrInput" placeholder="Enter PNR"><button onclick="checkPNR()">Check Status</button><p id="status"></p></section>
<script>
let currentPNR='';
function trains(){let a=origin.value,b=destination.value,d=journey.value;trainResult.innerText=a&&b&&d?'Available: Intercity Express, '+a+' to '+b+' on '+d+'.':'Enter origin, destination and date.'}
function reserve(){if(!name.value.trim()||!journey.value){alert('Enter passenger name and journey date.');return}currentPNR=String(Math.floor(1000000000+Math.random()*8999999999));pnr.innerText='Reservation requested for '+name.value+'. Class: '+document.getElementById('class').value+'. PNR: '+currentPNR+' (Demo)'}
function checkPNR(){status.innerText=pnrInput.value&&pnrInput.value===currentPNR?'Status: Confirmed (demo)':'No matching PNR in this demo.'}
</script></body></html>
