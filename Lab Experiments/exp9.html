<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Experiment 9 - TechSavvy</title>
<style>body{font-family:Arial;margin:20px;background:#f5f5f5}section{background:white;padding:15px;margin:12px 0;border:1px solid #ccc}.item{border-bottom:1px solid #ddd;padding:10px}button,input,select{padding:8px;margin:5px}</style></head>
<body><h1>TechSavvy Gadget Store</h1><section><h2>Products</h2><input id="search" placeholder="Search product"><select id="category"><option>All</option><option>Phone</option><option>Laptop</option><option>Tablet</option><option>Accessory</option></select><button onclick="filterProducts()">Filter</button>
<div id="products"><div class="item" data-category="Phone">Smartphone - ₹15,000 <button onclick="add('Smartphone',15000)">Add to Cart</button></div><div class="item" data-category="Laptop">Laptop - ₹45,000 <button onclick="add('Laptop',45000)">Add to Cart</button></div><div class="item" data-category="Tablet">Tablet - ₹20,000 <button onclick="add('Tablet',20000)">Add to Cart</button></div><div class="item" data-category="Accessory">Headphones - ₹1,500 <button onclick="add('Headphones',1500)">Add to Cart</button></div></div></section>
<section><h2>Shopping Cart</h2><ul id="cart"></ul><p id="total">Total: ₹0</p><button onclick="checkout()">Checkout</button><p id="order"></p></section>
<script>
let cart=[];function filterProducts(){let q=search.value.toLowerCase(),c=category.value;document.querySelectorAll('.item').forEach(x=>x.style.display=(x.innerText.toLowerCase().includes(q)&&(c==='All'||x.dataset.category===c))?'':'none')}
function add(n,p){cart.push({n,p});render()}function render(){cart.innerHTML='';let total=0;cart.forEach((x,i)=>{total+=x.p;let li=document.createElement('li');li.textContent=x.n+' - ₹'+x.p+' ';let b=document.createElement('button');b.textContent='Remove';b.onclick=()=>{cart.splice(i,1);render()};li.appendChild(b);cart.appendChild(li)});document.getElementById('total').innerText='Total: ₹'+total}
function checkout(){order.innerText=cart.length?'Order placed in demo. Total: '+totalText():'Your cart is empty.'}function totalText(){return '₹'+cart.reduce((s,x)=>s+x.p,0)}
</script></body></html>
