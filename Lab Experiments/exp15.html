<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Experiment - EasyToll</title><style>body{font-family:Arial;margin:20px;background:#f5f5f5}section{background:white;padding:15px;margin:12px 0;border:1px solid #ccc}input,select,button{padding:8px;margin:5px}.item{border:1px solid #ddd;padding:10px;margin:8px}</style></head><body><h1>EasyToll</h1><section><h2>Vehicle Details</h2><input id="owner" placeholder="Owner name"><input id="vehicle" placeholder="Vehicle number"><select id="type"><option>Car</option><option>Bike</option><option>Truck</option></select><button onclick="addV()">Add Vehicle</button><p id="vmsg"></p></section><section><h2>eWallet</h2>Balance: ₹<span id="balance">1000</span><input id="amount" type="number" placeholder="Amount"><button onclick="addMoney()">Add Money</button><button onclick="pay()">Pay Toll ₹150</button><p id="wallet"></p></section><section><h2>Toll Pass</h2><button onclick="applyPass()">Apply for Pass</button><p id="pass"></p></section><script>let bal=1000;function addV(){if(!owner.value||!vehicle.value)return alert('Enter details');vmsg.innerText=vehicle.value+' registered for '+owner.value}function addMoney(){let a=+amount.value;if(a<=0)return alert('Enter valid amount');bal+=a;balance.innerText=bal;wallet.innerText='₹'+a+' added'}function pay(){if(bal<150)return wallet.innerText='Insufficient balance';bal-=150;balance.innerText=bal;wallet.innerText='Toll payment successful. Demo QR: ET'+Math.floor(10000+Math.random()*90000)}function applyPass(){pass.innerText=vehicle.value?'Pass application submitted for '+vehicle.value+' (demo)':'Add vehicle first'}</script></body></html>
